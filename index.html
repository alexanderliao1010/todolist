<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alex 待辦看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow phone-first column — summary strip, filters, then due-date groups (逾期 → 今天 → 7天內 → 之後 → 已完成) */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1d2321; --muted:#68716d; --line:#dde1de;
  --accent:#1f5c55; --accent-ink:#ffffff;
  --eng:#2f5d8a; --eng-bg:#e4ecf5;
  --hr:#7a4a72;  --hr-bg:#f1e6ef;
  --mgt:#6b6a1f; --mgt-bg:#eeeddc;
  --own:#a1502a; --own-bg:#f7e9df;
  --late:#b23b2b; --late-bg:#f8e6e2; --soon:#a8660b; --week-bg:#e4eefb;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --surface:#1d2321; --fg:#e7ebe9; --muted:#9aa49f; --line:#2e3633;
  --accent:#6cb8ad; --accent-ink:#0e1a18;
  --eng:#8fb6de; --eng-bg:#1f2c3a; --hr:#d3a6ca; --hr-bg:#33232f; --mgt:#c9c779; --mgt-bg:#2c2b18;
  --own:#e9a885; --own-bg:#3a261b;
  --late:#f08b7a; --late-bg:#3a201b; --soon:#e6a650; --week-bg:#1b2a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --surface:#1d2321; --fg:#e7ebe9; --muted:#9aa49f; --line:#2e3633;
  --accent:#6cb8ad; --accent-ink:#0e1a18;
  --eng:#8fb6de; --eng-bg:#1f2c3a; --hr:#d3a6ca; --hr-bg:#33232f; --mgt:#c9c779; --mgt-bg:#2c2b18;
  --own:#e9a885; --own-bg:#3a261b;
  --late:#f08b7a; --late-bg:#3a201b; --soon:#e6a650; --week-bg:#1b2a3c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.6rem;margin:0;letter-spacing:.02em}
.today{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.late b{color:var(--late)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters select{margin-left:auto;max-width:12rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group h2{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.group h2 .n{font-family:var(--f-mono)}
.group.late h2{color:var(--late)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li.is-late{background:var(--late-bg)}
li.is-week{background:var(--week-bg)}
.who{font-weight:500;color:var(--fg)}
li input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);cursor:pointer}
.body{min-width:0}
.title{font-weight:500;overflow-wrap:anywhere}
li.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:.82rem;color:var(--muted);align-items:center}
.pill{background:var(--bg);color:var(--muted);border-radius:4px;padding:1px 7px;font-size:.78rem;font-weight:500}
.pill.工程{color:var(--eng);background:var(--eng-bg)}
.pill.人資{color:var(--hr);background:var(--hr-bg)}
.pill.管理{color:var(--mgt);background:var(--mgt-bg)}
.pill.私人{color:var(--own);background:var(--own-bg)}
.due{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due.late{color:var(--late)} .due.soon{color:var(--soon)}
.del{border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer;padding:2px 4px;white-space:nowrap}
.del.confirm{color:var(--late);font-weight:700}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.edit-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:.8rem;font-weight:500;cursor:pointer;padding:2px 4px;white-space:nowrap}
li.editing{display:block;background:var(--surface)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.ed .full{grid-column:1/-1}
.ed input,.ed select{width:100%;min-height:42px;font-size:16px}
.ed-btns{grid-column:1/-1;display:flex;gap:8px}
.ed-btns button{flex:1;border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.ed-save{background:var(--accent);color:var(--accent-ink);border:0}
.ed-cancel{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
@media (max-width:600px){.ed{grid-template-columns:1fr}}
details.add{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
details.add summary{cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:12px 14px;list-style:none;text-align:center;font-size:1rem}
details.add summary::-webkit-details-marker{display:none}
details.add[open] summary{background:var(--surface);color:var(--accent);border-bottom:1px solid var(--line)}
details.add form{padding:0 14px 14px}
.quick{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.quick label{font-size:.85rem;color:var(--fg);font-weight:500;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.quick .hint{font-weight:400;font-size:.75rem;color:var(--muted)}
.quick-row{display:flex;gap:8px;align-items:stretch}
.quick textarea{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
form .quick-row button{grid-column:auto;white-space:nowrap;padding:0 14px}
form .quick-row button:disabled{opacity:.6;cursor:wait}
.quick-msg{font-size:.8rem;color:var(--muted);min-height:1em}
.quick-msg.err{color:var(--late)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
form .full{grid-column:1/-1}
form button{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.done-group summary{cursor:pointer;font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:6px}
.note{font-size:.8rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem}
form label>input,form label>select{width:100%;min-height:44px}
form input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
form>*{min-width:0}
@media (max-width:600px){
  form{grid-template-columns:1fr;gap:12px}
  form input,form select,.quick textarea{font-size:16px}
  .quick-row{flex-direction:column}
  form .quick-row button{padding:11px 14px;font-size:1rem}
  form button[type=submit]{padding:13px;font-size:1rem}
  .filters select{margin-left:0;max-width:none;flex:1 1 100%}
}
@media (prefers-reduced-motion:no-preference){li{transition:background .15s}}

details.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.set summary{cursor:pointer;color:var(--muted);font-size:.9rem}
details.set form{padding:0}
button.stat{font:inherit;color:var(--fg);text-align:left;cursor:pointer;width:100%}
button.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.duebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:.9rem}
.duebar button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.conn-ok{color:var(--accent)} .conn-bad{color:var(--late)}
.tools{display:flex;gap:8px;justify-content:center}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>待辦看板</h1>
    <div class="today"><span id="today"></span> · <span id="conn">未設定</span></div>
  </header>

  <details class="set" id="setBox">
    <summary>⚙ GitHub 連線設定</summary>
    <form id="setForm">
      <label class="full">GitHub 帳號<input id="sOwner" autocomplete="off" autocapitalize="off" placeholder="例：alexliao"></label>
      <label class="full">資料 repo 名稱<input id="sRepo" autocomplete="off" autocapitalize="off" value="todo-data"></label>
      <label class="full">Token（只存在這台裝置）<input id="sToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <button type="submit">儲存並連線</button>
    </form>
  </details>

  <div class="summary">
    <button type="button" class="stat late" data-due="late" aria-pressed="false"><b id="sLate">–</b><span>已逾期</span></button>
    <button type="button" class="stat" data-due="today" aria-pressed="false"><b id="sToday">–</b><span>今天到期</span></button>
    <button type="button" class="stat" data-due="week" aria-pressed="false"><b id="sWeek">–</b><span>7 天內</span></button>
  </div>

  <details class="add" id="addBox">
    <summary>＋ 新增待辦</summary>
    <form id="addForm">
      <div class="quick full" id="quickBox">
        <label for="fQuick">一句話新增<span class="hint">點欄位後按鍵盤上的麥克風，說一整句</span></label>
        <div class="quick-row">
          <textarea id="fQuick" rows="2" placeholder="例：下週三前送硯森的施工計畫書"></textarea>
          <button type="button" id="parseBtn">自動填入</button>
        </div>
        <div class="quick-msg" id="quickMsg" role="status"></div>
      </div>
      <label class="full">事項<input id="fTitle" required placeholder="例：送施工計畫書"></label>
      <label>截止日<input id="fDue" type="date" required></label>
      <label>時段<select id="fSlot"><option value="">不指定</option><option>早上</option><option>下午</option><option>晚上</option></select></label>
      <label class="full">類別<select id="fCat"></select></label>
      <label class="full" id="catOtherWrap" hidden>新類別名稱<input id="fCatNew" placeholder="例：財務"></label>
      <label class="full">執行者<select id="fWho"></select></label>
      <label class="full" id="whoOtherWrap" hidden>新執行者名稱<input id="fWhoNew" placeholder="例：小明"></label>
      <label class="full">業主／案場<select id="fClientSel"><option value="">（不指定）</option></select></label>
      <label class="full" id="clientOtherWrap" hidden>新業主／案場名稱<input id="fClient" placeholder="例：硯森營造"></label>
      <button type="submit" id="addBtn">加入</button>
    </form>
  </details>

  <div class="filters" role="group" aria-label="類別篩選" id="catChips"></div>
  <div class="filters" role="group" aria-label="執行者篩選" id="whoChips"></div>
  <div class="filters">
    <select id="clientFilter" aria-label="業主／案場篩選"><option value="">所有業主／案場</option></select>
  </div>

  <div id="list"><div class="empty"><strong>尚未連線</strong>先在上方「GitHub 連線設定」填入帳號、repo 和 token。</div></div>

  <div class="tools"><button type="button" id="refreshBtn">重新整理</button></div>
  <p class="note">資料存在你的私人 GitHub repo。也可以在 Claude 對話裡說「增加待辦」。<br>版本 G10（10/22）</p>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const DEFAULT_CLIENTS=["妃鉑","耆安","燃舍","豹發力","手機王","金日昇"];
  let dueF="", who="";
  const BASE_CATS=["工程","人資","管理","私人"], BASE_WHO=["我","筑婷","小床","張詰"];
  let presetCats=[], presetPeople=[];
  const uniq=a=>[...new Set(a.filter(x=>x&&x!=="其他"))];
  const allCats=()=>uniq(BASE_CATS.concat(presetCats,todos.map(t=>t.category)));
  const allPeople=()=>uniq(BASE_WHO.concat(presetPeople,todos.map(t=>t.assignee)));
  const OTHER="__other";
  function fillSel(s,list,keep,extra){const v=keep??s.value;s.replaceChildren(...(extra||[]).map(([a,b])=>new Option(b,a)),...list.map(x=>new Option(x,x)),new Option("＋ 其他（自行輸入）",OTHER));s.value=(list.includes(v)||v===OTHER||(extra||[]).some(e=>e[0]===v))?v:(extra&&extra.length?extra[0][0]:list[0]);}
  function addTo(d,key,v,base){if(!v||base.includes(v))return;d[key]=d[key]||[];if(!d[key].includes(v))d[key].push(v);}
  const whoOf=t=>t.assignee||"我";
  let presetClients=[], todos=[], cat="", client="", pendingDel=null, editingId=null, sha=null, busy=false;
  let cfg={owner:"",repo:"todo-data",token:""};
  try{const c=JSON.parse(localStorage.getItem("todoCfg")||"{}");Object.assign(cfg,c);}catch(e){}
  const qs=new URLSearchParams(location.search);
  const RO=qs.has("view");
  if(qs.get("owner")) cfg.owner=qs.get("owner");
  if(qs.get("repo")) cfg.repo=qs.get("repo");

  function ymd(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
  function dayDiff(s){const [y,m,d]=s.split("-").map(Number);const a=new Date(y,m-1,d);const t=new Date();t.setHours(0,0,0,0);return Math.round((a-t)/864e5);}
  const WD="日一二三四五六";
  function fmtDue(s){const [y,m,d]=s.split("-").map(Number);return m+"/"+d+"（"+WD[new Date(y,m-1,d).getDay()]+"）";}
  function rel(n){return n<0?"逾期 "+(-n)+" 天":n===0?"今天":n===1?"明天":"剩 "+n+" 天";}
  const now=new Date();
  $("today").textContent=ymd(now)+"（"+WD[now.getDay()]+"）";
  $("fDue").value=ymd(new Date(Date.now()+864e5));
  function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
  function setConn(text,ok){const c=$("conn");c.textContent=text;c.className=ok?"conn-ok":"conn-bad";}

  // ---- GitHub 讀寫 ----
  const PATH="data.json";
  const api=()=>"https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo)+"/contents/"+PATH;
  const hdr=()=>({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
  function b64dec(b){const bin=atob(b.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
  function b64enc(s){const u=new TextEncoder().encode(s);let bin="";for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(bin);}
  function errText(st){return st===401?"token 無效或過期":st===403?"token 沒有這個 repo 的寫入權限":st===404?"找不到 repo 或 data.json，檢查帳號和 repo 名稱":"GitHub 回應 "+st;}

  async function load(){
    if(!cfg.owner||!cfg.token){setConn("未設定",false);$("setBox").open=true;return null;}
    setConn("讀取中…",true);
    const r=await fetch(api()+"?t="+Date.now(),{headers:hdr(),cache:"no-store"});
    if(!r.ok){setConn("連線失敗："+errText(r.status),false);throw new Error(errText(r.status));}
    const j=await r.json(); sha=j.sha;
    const d=JSON.parse(b64dec(j.content)||"{}");
    presetClients=Array.isArray(d.clients)?d.clients:[]; presetCats=Array.isArray(d.categories)?d.categories:[]; presetPeople=Array.isArray(d.people)?d.people:[]; todos=Array.isArray(d.todos)?d.todos:[];
    if(RO) todos=todos.filter(t=>t.category!=="私人");
    setConn(RO?"已連線（唯讀）":"已連線 GitHub",true); render(); return d;
  }

  // 每次寫入：先讀最新 → 套用修改 → 存回；若同時有人改過（409）就重來一次
  async function mutate(fn,label){
    if(RO){toast("唯讀檢視，無法修改");return false;}
    if(busy) return false; busy=true;
    try{
      for(let attempt=0;attempt<3;attempt++){
        const d=await load(); if(!d) return false;
        fn(d);
        const body=JSON.stringify({message:label,content:b64enc(JSON.stringify(d,null,2)+"\n"),sha});
        const r=await fetch(api(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},hdr()),body});
        if(r.ok){const j=await r.json();sha=j.content.sha;presetClients=d.clients||[];todos=d.todos||[];render();return true;}
        if(r.status!==409&&r.status!==422){setConn("寫入失敗："+errText(r.status),false);toast("寫入失敗："+errText(r.status));return false;}
      }
      toast("寫入衝突，請按重新整理後再試");return false;
    }catch(e){toast("網路錯誤，請稍後再試");return false;}
    finally{busy=false;}
  }

  // ---- 畫面 ----
  function editEl(t){
    const li=document.createElement("li"); li.className="editing";
    const f=document.createElement("form"); f.className="ed";
    const mk=(label,el,full)=>{const l=document.createElement("label");if(full)l.className="full";l.append(label,el);f.appendChild(l);return el;};
    const sel=(opts,val)=>{const s=document.createElement("select");opts.forEach(([v,tx])=>s.appendChild(new Option(tx,v)));s.value=val;return s;};
    const iT=mk("事項",Object.assign(document.createElement("input"),{value:t.title||"",required:true}),true);
    const iD=mk("截止日",Object.assign(document.createElement("input"),{type:"date",value:t.due||""}));
    const iP=mk("時段",sel([["","不指定"],["早上","早上"],["下午","下午"],["晚上","晚上"]],t.slot||""));
    const pair=(label,list,val,full)=>{const s=document.createElement("select");fillSel(s,list,list.includes(val)||!val?(val||list[0]):OTHER);mk(label,s,full);
      const o=Object.assign(document.createElement("input"),{value:list.includes(val)?"":(val||""),placeholder:"新"+label+"名稱"});
      const l=document.createElement("label");l.className="full";l.append("新"+label+"名稱",o);l.hidden=s.value!==OTHER;f.appendChild(l);
      s.addEventListener("change",()=>{l.hidden=s.value!==OTHER;if(!l.hidden)o.focus();});
      return ()=>s.value===OTHER?o.value.trim():s.value;};
    const gC=pair("類別",allCats(),t.category,true);
    const gW=pair("執行者",allPeople(),whoOf(t),true);
    const cl=allClients(); const cur=t.client||"";
    const iS=mk("業主／案場",sel([["","（不指定）"]].concat(cl.map(x=>[x,x]),[["__other","＋ 其他（自行輸入）"]]),cl.includes(cur)||!cur?cur:"__other"),true);
    const iO=Object.assign(document.createElement("input"),{value:cl.includes(cur)?"":cur,placeholder:"新業主／案場名稱"});
    const oL=document.createElement("label");oL.className="full";oL.append("新業主／案場名稱",iO);oL.hidden=iS.value!=="__other";f.appendChild(oL);
    iS.addEventListener("change",()=>{oL.hidden=iS.value!=="__other";});
    const bx=document.createElement("div");bx.className="ed-btns";
    const sv=Object.assign(document.createElement("button"),{type:"submit",className:"ed-save",textContent:"儲存"});
    const cc=Object.assign(document.createElement("button"),{type:"button",className:"ed-cancel",textContent:"取消"});
    cc.addEventListener("click",()=>{editingId=null;render();});
    bx.append(cc,sv);f.appendChild(bx);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const title=iT.value.trim(); if(!title) return;
      const upd={title,due:iD.value,slot:iP.value,category:gC(),assignee:gW()||"我",client:iS.value==="__other"?iO.value.trim():iS.value};
      sv.disabled=true; sv.textContent="儲存中…";
      const ok=await mutate(d=>{const x=(d.todos||[]).find(y=>y.id===t.id);if(x)Object.assign(x,upd);addTo(d,"categories",upd.category,BASE_CATS);addTo(d,"people",upd.assignee,BASE_WHO);if(upd.client){d.clients=d.clients||[];if(!d.clients.includes(upd.client))d.clients.push(upd.client);}},"修改："+title);
      if(ok){editingId=null;render();toast("已儲存");}else{sv.disabled=false;sv.textContent="儲存";}
    });
    li.appendChild(f); return li;
  }
  function itemEl(t){
    if(editingId===t.id&&!RO) return editEl(t);
    const li=document.createElement("li");
    if(t.done) li.className="done";
    else if(t.due){const n=dayDiff(t.due); if(n<0) li.className="is-late"; else if(n<=7) li.className="is-week";}
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!t.done; cb.disabled=RO;
    cb.setAttribute("aria-label","完成："+t.title);
    cb.addEventListener("change",async()=>{const v=cb.checked;const ok=await mutate(d=>{const x=(d.todos||[]).find(y=>y.id===t.id);if(x)x.done=v;},(v?"完成：":"取消完成：")+t.title);if(!ok)cb.checked=!v;});
    const body=document.createElement("div"); body.className="body";
    const ti=document.createElement("div"); ti.className="title"; ti.textContent=t.title||"（未命名）";
    const meta=document.createElement("div"); meta.className="meta";
    if(t.category){const p=document.createElement("span");p.className="pill "+t.category;p.textContent=t.category;meta.appendChild(p);}
    {const w=document.createElement("span");w.className="who";w.textContent="執行："+whoOf(t);meta.appendChild(w);}
    if(t.client){const c=document.createElement("span");c.textContent=t.client;meta.appendChild(c);}
    if(t.due){const n=dayDiff(t.due);const d=document.createElement("span");d.className="due"+(!t.done&&n<0?" late":!t.done&&n<=2?" soon":"");d.textContent=fmtDue(t.due)+(t.slot?" "+t.slot:"")+(t.done?"":" · "+rel(n));meta.appendChild(d);}
    body.append(ti,meta);
    const del=document.createElement("button"); del.className="del"; del.type="button"; del.textContent="刪除"; del.hidden=RO;
    if(pendingDel===t.id){del.classList.add("confirm");del.textContent="確認刪除";}
    del.addEventListener("click",async()=>{
      if(pendingDel!==t.id){pendingDel=t.id;render();setTimeout(()=>{if(pendingDel===t.id){pendingDel=null;render();}},4000);return;}
      pendingDel=null;
      if(await mutate(d=>{d.todos=(d.todos||[]).filter(y=>y.id!==t.id);},"刪除："+t.title)) toast("已刪除");
    });
    const ed=document.createElement("button"); ed.className="edit-btn"; ed.type="button"; ed.textContent="修改"; ed.hidden=RO;
    ed.addEventListener("click",()=>{editingId=t.id;pendingDel=null;render();});
    const cp=document.createElement("button"); cp.className="edit-btn"; cp.type="button"; cp.textContent="複製"; cp.hidden=RO;
    cp.addEventListener("click",async()=>{
      const copy=Object.assign({},t,{id:"t"+Date.now(),done:false,created:new Date().toISOString()});
      cp.disabled=true;
      const ok=await mutate(d=>{d.todos=d.todos||[];d.todos.push(copy);},"複製："+t.title);
      cp.disabled=false;
      if(ok){editingId=copy.id;pendingDel=null;render();toast("已複製，可直接修改");}
    });
    const acts=document.createElement("div"); acts.className="acts"; acts.append(ed,cp,del);
    li.append(cb,body,acts); return li;
  }
  function group(label,items,cls){
    const s=document.createElement("section"); s.className="group "+(cls||"");
    const h=document.createElement("h2"); h.textContent=label; const n=document.createElement("span"); n.className="n"; n.textContent=items.length; h.appendChild(n);
    const ul=document.createElement("ul"); items.forEach(t=>ul.appendChild(itemEl(t)));
    s.append(h,ul); return s;
  }
  function allClients(){return [...new Set(DEFAULT_CLIENTS.concat(presetClients,todos.map(t=>t.client)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));}
  function chips(box,list,cur,allLabel){box.replaceChildren(...[["",allLabel]].concat(list.map(x=>[x,x])).map(([v,tx])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=v;b.textContent=tx;b.setAttribute("aria-pressed",String(v===cur));return b;}));}
  function render(){
    const cats=allCats().filter(x=>!(RO&&x==="私人")), ppl=allPeople();
    if(cat&&!cats.includes(cat)) cat=""; if(who&&!ppl.includes(who)) who="";
    chips($("catChips"),cats,cat,"全部"); chips($("whoChips"),ppl,who,"所有人");
    fillSel($("fCat"),allCats()); fillSel($("fWho"),ppl);
    const open=todos.filter(t=>!t.done); const d=t=>t.due?dayDiff(t.due):9999;
    $("sLate").textContent=open.filter(t=>d(t)<0).length;
    $("sToday").textContent=open.filter(t=>d(t)===0).length;
    $("sWeek").textContent=open.filter(t=>d(t)>0&&d(t)<=7).length;
    const clients=allClients(); const sel=$("clientFilter"); const cur=sel.value;
    sel.replaceChildren(new Option("所有業主／案場",""),...clients.map(c=>new Option(c,c)));
    sel.value=clients.includes(cur)?cur:""; client=sel.value;
    const cs=$("fClientSel"), curC=cs.value;
    cs.replaceChildren(new Option("（不指定）",""),...clients.map(c=>new Option(c,c)),new Option("＋ 其他（自行輸入）","__other"));
    cs.value=(curC==="__other"||clients.includes(curC))?curC:"";
    const inDue=t=>!dueF||(!t.done&&(dueF==="late"?d(t)<0:dueF==="today"?d(t)===0:d(t)>0&&d(t)<=7));
    const shown=todos.filter(t=>(!cat||t.category===cat)&&(!client||t.client===client)&&(!who||whoOf(t)===who)&&inDue(t));
    document.querySelectorAll("button.stat").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.due===dueF)));
    const SO={"早上":1,"下午":2,"晚上":3};
    const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||((SO[a.slot]||4)-(SO[b.slot]||4));
    const o=shown.filter(t=>!t.done).sort(byDue), done=shown.filter(t=>t.done).sort((a,b)=>byDue(b,a));
    const list=$("list"); list.replaceChildren();
    if(dueF){const bar=document.createElement("div");bar.className="duebar";const lab=document.createElement("span");lab.textContent="只顯示："+{late:"已逾期",today:"今天到期",week:"7 天內到期"}[dueF]+"（"+shown.length+" 筆）";const x=document.createElement("button");x.type="button";x.textContent="顯示全部";x.addEventListener("click",()=>{dueF="";render();});bar.append(lab,x);list.appendChild(bar);}
    const put=html=>{const e=document.createElement("div");e.innerHTML=html;list.appendChild(e.firstChild);};
    if(!todos.length){list.innerHTML='<div class="empty"><strong>還沒有待辦事項</strong>點上方「新增待辦」加入第一筆。</div>';return;}
    if(!shown.length){put(dueF?'<div class="empty"><strong>沒有符合的事項</strong>這個時段目前沒有待辦。</div>':'<div class="empty"><strong>這個篩選下沒有事項</strong>換個類別或業主看看。</div>');return;}
    list.style.display="flex";list.style.flexDirection="column";list.style.gap="12px";
    const wrap=document.createElement("div"); wrap.style.cssText="display:flex;flex-direction:column;gap:18px";
    [["逾期",o.filter(t=>d(t)<0),"late"],["今天",o.filter(t=>d(t)===0)],["7 天內",o.filter(t=>d(t)>0&&d(t)<=7)],["之後",o.filter(t=>d(t)>7)]]
      .forEach(([l,items,c])=>{if(items.length) wrap.appendChild(group(l,items,c));});
    if(!o.length){const e=document.createElement("div");e.className="empty";e.innerHTML="<strong>全部完成了</strong>目前沒有未完成的事項。";wrap.appendChild(e);}
    if(done.length){const det=document.createElement("details");det.className="done-group";const sm=document.createElement("summary");sm.textContent="已完成 "+done.length;det.appendChild(sm);const ul=document.createElement("ul");done.forEach(t=>ul.appendChild(itemEl(t)));det.appendChild(ul);wrap.appendChild(det);}
    list.appendChild(wrap);
  }

  // 不靠 AI 的備用解析：日期、業主、類別用規則判斷
  const CN={"零":0,"〇":0,"一":1,"二":2,"兩":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  function cnNum(s){if(/^\d+$/.test(s))return +s;let n=0;if(s.includes("十")){const [a,b]=s.split("十");n=(a?CN[a]:1)*10+(b?CN[b]:0);}else n=CN[s];return n;}
  const NUM="(\\d{1,2}|[一二兩三四五六七八九十]{1,3})";
  const WDX={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0};
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function localParse(text){
    let s=text.replace(/^[\s，,。:：]*(增加|新增)?(代辦|待辦)(清單|事項)?[\s，,。:：]*/,""), due="", cat="", cli="", asg="", slot="";
    for(const n of allPeople().filter(x=>x!=="我").sort((a,b)=>b.length-a.length)){if(s.includes(n)){asg=n;s=s.replace(n,"");break;}}
    if(!asg&&/^[\s，,]*我[\s，,]/.test(s)){asg="我";s=s.replace(/^[\s，,]*我/,"");}
    s=s.replace(/^[\s，,。]+/,"");
    const t=new Date(); t.setHours(0,0,0,0);
    const cut=m=>{s=s.replace(m,"");};
    let m;
    if((m=s.match(/(下個?月|這個?月|本月)?月底/))){const k=m[1]&&m[1].startsWith("下")?2:1;due=ymd(new Date(t.getFullYear(),t.getMonth()+k,0));cut(m[0]);}
    else if((m=s.match(new RegExp(NUM+"[月/]"+NUM+"[日號]?")))){let d=new Date(t.getFullYear(),cnNum(m[1])-1,cnNum(m[2]));if(d<t)d.setFullYear(d.getFullYear()+1);due=ymd(d);cut(m[0]);}
    else if((m=s.match(/(下下|下|這|本)?(?:個)?(?:週|周|星期|禮拜)([一二三四五六日天])/))){
      const target=WDX[m[2]], mondayIdx=(t.getDay()+6)%7, monday=addDays(t,-mondayIdx), offset=(target+6)%7;
      let d;
      if(m[1]==="下下") d=addDays(monday,14+offset);
      else if(m[1]==="下") d=addDays(monday,7+offset);
      else if(m[1]) d=addDays(monday,offset);
      else {d=addDays(monday,offset); if(d<t) d=addDays(d,7);}
      due=ymd(d);cut(m[0]);
    }
    else if((m=s.match(/大後天|後天|明天|今天|今日|明日|今晚|明晚/))){if(m[0]==="今晚"||m[0]==="明晚")slot="晚上";due=ymd(addDays(t,{"今天":0,"今日":0,"今晚":0,"明天":1,"明日":1,"明晚":1,"後天":2,"大後天":3}[m[0]]));cut(m[0]);}
    else if((m=s.match(new RegExp(NUM+"天(後|內|之內)")))){due=ymd(addDays(t,cnNum(m[1])));cut(m[0]);}
    else if((m=s.match(new RegExp(NUM+"[日號]")))){let d=new Date(t.getFullYear(),t.getMonth(),cnNum(m[1]));if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,cnNum(m[1]));due=ymd(d);cut(m[0]);}
    const known=[...new Set(presetClients.concat(todos.map(x=>x.client)).filter(Boolean))].sort((a,b)=>b.length-a.length);
    for(const c of known){const short=c.replace(/(股份)?有限公司|營造|公司/g,"");if(s.includes(c)||(short.length>=2&&s.includes(short))){cli=c;break;}}
    const KW={"工程":/施工|工程|標案|投標|估價|估驗|監造|三書|工地|案場|竣工|開工|圖說|預算書|驗收|報價|服務建議書/,"人資":/薪資|勞健保|勞保|健保|招募|面試|員工|人資|人事|考核|職等|offer|請假|加班/i,"管理":/財務|治理|董事|股東|報表|經營|預算|會議|開會|簡報|稅|合約|門市|營運/,"私人":/家裡|家務|小孩|老婆|太太|爸|媽|醫院|看診|繳費|私人|個人/};
    for(const k of allCats().filter(x=>!BASE_CATS.includes(x))){if(text.includes(k)){cat=k;break;}}
    if(!cat) for(const k of BASE_CATS){if(KW[k].test(text)){cat=k;break;}}
    s=s.replace(/^[\s，,。]*(提醒我|記得|要|請|幫我)+/,"").replace(/(之前|以前|前)(?=[^一-鿿]|要|送|交|完成|處理|$)/,"").replace(/^[\s的，,]+|[\s，,。]+$/g,"").replace(/^(要|送出?)?的/,"").trim();
    if(!slot){const sm=s.match(/早上|上午|清晨|中午|下午|傍晚|晚上/);if(sm){slot={"早上":"早上","上午":"早上","清晨":"早上","中午":"下午","下午":"下午","傍晚":"晚上","晚上":"晚上"}[sm[0]];s=s.replace(sm[0],"").replace(/^[\s，,]+/,"");}}
    return {title:s||text,due,slot,category:cat,client:cli,assignee:asg};
  }
  function fill(r){
    if(r.title) $("fTitle").value=String(r.title);
    if(/^\d{4}-\d{2}-\d{2}$/.test(r.due||"")) $("fDue").value=r.due;
    if(r.slot) $("fSlot").value=r.slot;
    if(allCats().includes(r.category)){$("fCat").value=r.category;$("catOtherWrap").hidden=true;}
    if(allPeople().includes(r.assignee)){$("fWho").value=r.assignee;$("whoOtherWrap").hidden=true;}
    if(r.client){const c=String(r.client);if(allClients().includes(c)){$("fClientSel").value=c;$("clientOtherWrap").hidden=true;}else{$("fClientSel").value="__other";$("clientOtherWrap").hidden=false;$("fClient").value=c;}}
    const miss=[]; if(!r.due) miss.push("截止日"); if(!r.category) miss.push("類別"); if(!r.client) miss.push("業主／案場");
    return miss;
  }

  $("parseBtn").addEventListener("click",()=>{
    const text=$("fQuick").value.trim(), msg=$("quickMsg");
    msg.className="quick-msg";
    if(!text){msg.textContent="先說或打一句話";return;}
    const miss=fill(localParse(text));
    msg.textContent=(miss.length?"已填入，請補上："+miss.join("、"):"已填入")+"，確認後按「加入」";
  });

  $("addForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const item={id:"t"+Date.now(),title:$("fTitle").value.trim(),due:$("fDue").value,slot:$("fSlot").value,category:pick("fCat","fCatNew"),assignee:pick("fWho","fWhoNew")||"我",client:getClient(),done:false,created:new Date().toISOString()};
    if(!item.title||!item.due) return;
    const btn=$("addBtn"); btn.disabled=true; btn.textContent="加入中…";
    const ok=await mutate(d=>{d.todos=d.todos||[];d.todos.push(item);addTo(d,"categories",item.category,BASE_CATS);addTo(d,"people",item.assignee,BASE_WHO);if(item.client){d.clients=d.clients||[];if(!d.clients.includes(item.client))d.clients.push(item.client);}},"新增："+item.title);
    btn.disabled=false; btn.textContent="加入";
    if(ok){$("fTitle").value="";$("fClient").value="";$("fClientSel").value="";$("clientOtherWrap").hidden=true;$("fCatNew").value="";$("fWhoNew").value="";$("fSlot").value="";$("catOtherWrap").hidden=true;$("whoOtherWrap").hidden=true;$("fCat").value=allCats()[0];$("fWho").value="我";$("fQuick").value="";$("quickMsg").textContent="";$("addBox").open=false;toast("已加入");}
  });

  function getClient(){const v=$("fClientSel").value;return v==="__other"?$("fClient").value.trim():v;}
  $("fClientSel").addEventListener("change",e=>{const o=e.target.value==="__other";$("clientOtherWrap").hidden=!o;if(o)$("fClient").focus();});
  render();

  $("setForm").addEventListener("submit",async e=>{
    e.preventDefault();
    cfg={owner:$("sOwner").value.trim(),repo:$("sRepo").value.trim()||"todo-data",token:$("sToken").value.trim()};
    try{localStorage.setItem("todoCfg",JSON.stringify(cfg));}catch(err){toast("這個瀏覽器無法記住設定，關閉後需重填");}
    try{await load();$("setBox").open=false;toast("已連線");}catch(err){toast(err.message);}
  });
  if(RO){$("addBox").hidden=true;document.querySelector(".note").textContent="唯讀檢視：只能查看，無法新增或修改。";}
  $("sOwner").value=cfg.owner; $("sRepo").value=cfg.repo; $("sToken").value=cfg.token;

  $("catChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.v;render();});
  $("whoChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;who=b.dataset.v;render();});
  function pick(selId,inId){const v=$(selId).value;return v===OTHER?$(inId).value.trim():v;}
  $("fCat").addEventListener("change",e=>{const o=e.target.value===OTHER;$("catOtherWrap").hidden=!o;if(o)$("fCatNew").focus();});
  $("fWho").addEventListener("change",e=>{const o=e.target.value===OTHER;$("whoOtherWrap").hidden=!o;if(o)$("fWhoNew").focus();});
  $("clientFilter").addEventListener("change",e=>{client=e.target.value;render();});
  document.querySelectorAll("button.stat").forEach(b=>b.addEventListener("click",()=>{dueF=dueF===b.dataset.due?"":b.dataset.due;render();$("list").scrollIntoView({behavior:"smooth",block:"start"});}));
  $("refreshBtn").addEventListener("click",()=>load().catch(()=>{}));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!busy&&!editingId)load().catch(()=>{});});

  load().catch(()=>{});
})();
</script>
</body>
